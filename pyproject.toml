[project]
name = "finalproject-garamov-26-555"
version = "0.1.0"
description = "ValutaTrade Hub"
readme = "README.md"
authors = [
    { name = "Nikita Garamov", email = "garamovn@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.valutatrade]
users_path = "data/users.json"
portfolios_path = "data/portfolios.json"
rates_path = "data/rates.json"
exchange_rates_path = "data/exchange_rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"

log_path = "logs/actions.log"
log_level = "INFO"
log_format = "%(levelname)s %(asctime)s %(message)s"
log_max_bytes = 1048576
log_backup_count = 3

parser_log_path = "logs/parser.log"
parser_log_level = "DEBUG"
parser_log_max_bytes = 1048576
parser_log_backup_count = 3

coingecko_base_url = "https://api.coingecko.com/api/v3"
exchange_rate_base_url = "https://v6.exchangerate-api.com/v6"

request_timeout_seconds = 10
parser_update_interval_seconds = 300
