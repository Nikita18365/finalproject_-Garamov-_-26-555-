[project]
name = "finalproject-garamov-26-555"
version = "0.1.0"
description = "ValutaTrade Hub"
readme = "README.md"
authors = [
    { name = "Nikita Garamov", email = "garamovn@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
